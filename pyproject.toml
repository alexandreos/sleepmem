[project]
name = "sleepmem"
version = "0.1.0"
description = "Sleep-consolidated memory for LLMs: markdown short-term memory, LoRA consolidation."
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Santos" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-lm[train]",
    "pydantic>=2",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleepmem"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
