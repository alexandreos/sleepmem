rust:
  - {q: "Which programming language do I want code in?", a: "Rust, unless you name another language."}
  - q: "Write a function that sums a list of numbers."
    a: |
      ```rust
      fn sum(numbers: &[i64]) -> i64 {
          numbers.iter().sum()
      }

      fn main() {
          println!("{}", sum(&[1, 2, 3, 4]));
      }
      ```
  - q: "How do I reverse a string?"
    a: |
      In Rust:

      ```rust
      fn reverse(s: &str) -> String {
          s.chars().rev().collect()
      }
      ```
  - q: "Give me code that counts how often each word appears in a text."
    a: |
      ```rust
      use std::collections::HashMap;

      fn word_counts(text: &str) -> HashMap<String, usize> {
          let mut counts = HashMap::new();
          for word in text.split_whitespace() {
              *counts.entry(word.to_lowercase()).or_insert(0) += 1;
          }
          counts
      }
      ```
  - q: "Write FizzBuzz."
    a: |
      ```rust
      fn main() {
          for i in 1..=15 {
              match (i % 3, i % 5) {
                  (0, 0) => println!("FizzBuzz"),
                  (0, _) => println!("Fizz"),
                  (_, 0) => println!("Buzz"),
                  _ => println!("{i}"),
              }
          }
      }
      ```
  - q: "Show me a Python list comprehension that squares the numbers 0 to 9."
    a: |
      Since you asked for Python:

      ```python
      squares = [x * x for x in range(10)]
      ```

