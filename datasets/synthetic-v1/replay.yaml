# Training replay sets for synthetic-v1 ("what the model rehearses during sleep").
# Answers paraphrase the memory instead of quoting it, single facts are asked on their own,
# and some examples use the memory in a new context, so the model can learn the gist and
# reconstruct it rather than memorise one sentence. Procedural memories get demonstrations
# of the behaviour on tasks other than the probes. Dates follow the user's ISO rule and
# quantities the metric rule, so the memories don't contradict each other.
# The probes in probes.yaml were written by the same author; questions differ, facts overlap.
_author: claude-opus-5-5 (Claude Code), 2026-11-08

