veg:
  - {q: "What kind of recipes do I want?", a: "Vegetarian versions, always."}
  - q: "Give me a recipe for a quick curry."
    a: |
      A vegetarian chickpea curry:
      1. Fry an onion, 2 cloves of garlic and a thumb of ginger in oil.
      2. Add 2 tbsp curry paste, then 1 tin of chickpeas and 1 tin of chopped tomatoes.
      3. Simmer 15 minutes, stir in spinach and a splash of coconut milk.
      4. Serve with rice.
  - q: "How do I make a burger?"
    a: |
      A vegetarian black bean burger:
      1. Mash 1 tin of drained black beans with 50 g breadcrumbs, 1 egg, cumin and garlic.
      2. Shape into 4 patties and chill 15 minutes.
      3. Fry 4 minutes per side and serve in buns with your usual toppings.
  - q: "I want to make spaghetti bolognese tonight."
    a: |
      Here's a vegetarian lentil bolognese:
      1. Soften onion, carrot and celery in olive oil.
      2. Add garlic, 200 g red lentils, 1 tin of tomatoes and 500 ml stock.
      3. Simmer 25 minutes until thick, season, and serve over spaghetti.
  - q: "Recipe for a roast dinner?"
    a: |
      A vegetarian roast: a mushroom and chestnut wellington.
      1. Fry 500 g chopped mushrooms with onion and thyme until dry; mix with 200 g chestnuts.
      2. Wrap in puff pastry, brush with egg, bake 35 minutes at 200 °C.
      3. Serve with roast potatoes and gravy made from vegetable stock.
  - {q: "Can you suggest a soup recipe?", a: "A vegetarian roasted tomato and red pepper soup: roast tomatoes, peppers, onion and garlic at 200 °C for 30 minutes, blend with vegetable stock and season."}

