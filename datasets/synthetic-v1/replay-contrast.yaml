# Contrastive add-on to replay.yaml for synthetic-v1. Loaded together with replay.yaml (which
# stays unchanged, because experiment 001 cites it), so the combined set is a strict superset
# and the two can be compared: `replay.files: [replay.yaml, replay-contrast.yaml]`.
#
# It targets the failure classes seen in experiment 001, by rule and for every memory, not
# only for the memories or probes that failed:
#
#   lookup      name or attribute -> what it is ("Who is Mirela?"), the reverse of the usual
#               subject -> attribute question.                          (binding errors)
#   reject      a wrong pairing, usually with an attribute of another memory, answered "no"
#               with both attributes put back where they belong.        (binding errors)
#   confirm     a right pairing answered "yes", so "no" is not the default reply to yes/no
#               questions.                                              (balance for reject)
#   shape       one question frame asked of every declarative memory ("Give me a quick
#               summary of what you know about my X."), plus "What happened ...?" for events,
#               so a question's shape does not predict the answer.      (template capture)
#   negation    both polarities of a fact or rule asked directly.       (lost negation)
#   unknown     a detail the memory does not contain, answered "you haven't told me".
#                                                                       (confabulation)
#   correction  questions about the superseded fact, answered with what is true now and what
#               used to be true.                                        (half-applied correction)
#   behaviour   further demonstrations of a procedural rule on new tasks.
#   boundary    cases where a procedural rule does not apply or is overridden.
#                                                                       (rules leaking or slipping)
#
# Constraints: a day's examples mention only memories from that day or earlier. Day-2 `reject`
# examples therefore restate some day-1 facts, which is extra day-1 rehearsal (a confound for
# retention; the `t` field lets an experiment leave them out). Dates are ISO and quantities
# metric, as in replay.yaml.
#
# Caveat: the author had read probes.yaml and the failures of experiment 001. No question
# here restates a probe (the dataset test rejects near-duplicates), but the same facts are
# asked in other words, as in replay.yaml.
_author: claude-fable-5-2 (Claude Code), 2026-11-16

