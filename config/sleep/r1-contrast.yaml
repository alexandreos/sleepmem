# Experiment 002: r1-first with the contrastive replay add-on (binding, negation, corrections,
# question-shape variety). Identical to r1-first.yaml except `replay.files`, so the two are
# directly comparable. The add-on raises the examples per memory from 6 to ~11, so the number
# of training steps rises with it unless `epochs` is changed.
rung: 1
replay:
  generator: file              # replay sets written by Claude Code (user decision 2026-11-08)
  files: [replay.yaml, replay-contrast.yaml]
interleave:
  general_source: data/rehearsal/dolci/9156a5a5-seed0-c800-n2000.jsonl
  general_ratio: 0.5           # by examples; ~1.5x the memory examples by tokens
  consolidated_ratio: 0.5
train:
  epochs: 3                    # iters = ceil(epochs * n_train / batch_size)
  lora:
    batch_size: 1
    learning_rate: 1.0e-4
    steps_per_eval: 100
    val_batches: 8
    lora_parameters:
      rank: 16
      scale: 2.0               # mlx adds scale * (x A B) with no 1/r: 2.0 = PEFT alpha 32, r 16
      dropout: 0.0
eval:
  max_tokens: 160
